server {
    server_name aska.sdnsembar01.sch.id;
    root /opt/ai-agent-sekolah/web_aska/static/aska-moved;

    location ^~ /api/ {
        default_type application/json;
        return 410 '{"error":"Layanan ASKA lama telah dinonaktifkan","new_url":"http://aska.sudindikju2.com/"}';
    }

    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/aska.sdnsembar01.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aska.sdnsembar01.sch.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name aska.sdnsembar01.sch.id;
    return 301 https://$host$request_uri;
}
