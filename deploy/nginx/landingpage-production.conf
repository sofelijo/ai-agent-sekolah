server {
    server_name sdnsembar01.sch.id www.sdnsembar01.sch.id;

    location /static/ {
        alias /opt/ai-agent-sekolah/landingpage/static/;
        expires 30d;
    }

    location /assets/ {
        alias /opt/ai-agent-sekolah/dashboard/static/;
        expires 30d;
    }

    location = /lapor-bullying {
        client_max_body_size 41m;
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sdnsembar01.sch.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sdnsembar01.sch.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sdnsembar01.sch.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sdnsembar01.sch.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sdnsembar01.sch.id www.sdnsembar01.sch.id;
    return 404; # managed by Certbot




}