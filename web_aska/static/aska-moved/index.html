<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,follow">
    <title>ASKA Telah Pindah</title>
    <meta name="description" content="Pemberitahuan alamat baru layanan ASKA.">
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #667085;
            --primary: #155eef;
            --primary-dark: #004eeb;
            --card: rgba(255, 255, 255, 0.94);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(21, 94, 239, 0.18), transparent 34%),
                radial-gradient(circle at 85% 80%, rgba(14, 165, 233, 0.16), transparent 32%),
                linear-gradient(145deg, #f8fbff, #edf4ff);
        }

        main {
            width: min(680px, 100%);
            padding: clamp(28px, 7vw, 56px);
            text-align: center;
            background: var(--card);
            border: 1px solid rgba(21, 94, 239, 0.13);
            border-radius: 28px;
            box-shadow: 0 28px 80px rgba(23, 32, 51, 0.14);
        }

        .mark {
            width: 76px;
            height: 76px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            color: #fff;
            background: linear-gradient(145deg, var(--primary), #0ea5e9);
            box-shadow: 0 18px 38px rgba(21, 94, 239, 0.3);
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.08em;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.3rem);
            line-height: 1.08;
            letter-spacing: -0.045em;
        }

        .lead {
            max-width: 540px;
            margin: 20px auto 0;
            color: var(--muted);
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            line-height: 1.75;
        }

        .destination {
            display: block;
            margin: 26px auto 0;
            padding: 14px 18px;
            overflow-wrap: anywhere;
            color: var(--primary-dark);
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            font-weight: 700;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
            padding: 14px 22px;
            color: #fff;
            background: var(--primary);
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(21, 94, 239, 0.28);
            font-weight: 800;
            text-decoration: none;
            transition: transform 160ms ease, background 160ms ease;
        }

        .button:hover,
        .button:focus-visible {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .button span { font-size: 1.2rem; }

        footer {
            margin-top: 30px;
            color: #98a2b3;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">A</div>
        <p class="eyebrow">Pemberitahuan Layanan</p>
        <h1>ASKA telah pindah</h1>
        <p class="lead">
            Mulai sekarang, layanan ASKA dapat diakses melalui alamat baru berikut.
        </p>
        <a class="destination" href="http://aska.sudindikju2.com/">http://aska.sudindikju2.com/</a>
        <a class="button" href="http://aska.sudindikju2.com/">
            Buka ASKA <span aria-hidden="true">→</span>
        </a>
        <footer>SDN Semper Barat 01</footer>
    </main>
</body>
</html>
